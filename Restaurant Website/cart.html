<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart - Addis Bites</title>
  <link rel="stylesheet" href="cart.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <!-- Header -->
  <header class="header">
  <div class="container">
    <h1 class="logo">
      <img src="RestaurantImages/SmallLogo.png" alt="Addis-Bites Logo">&nbsp;&nbsp; Addis-Bites
    </h1>
    <nav>
      <ul>
        <li><a href="AddisBite.html">Home</a></li>
        <li><a href="menu.html">Menu and Shop</a></li>
        <li><a href="deals.html">Deals</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>


  <!-- Cart Section -->
  <section class="cart">
    <h2>Your Shopping Cart</h2>

    <table class="cart-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Burger Deluxe</td>
          <td>2</td>
          <td>$8</td>
          <td>$16</td>
        </tr>
        <tr>
          <td>Milkshake</td>
          <td>1</td>
          <td>$4</td>
          <td>$4</td>
        </tr>
        <tr>
          <td>Donut</td>
          <td>3</td>
          <td>$3</td>
          <td>$9</td>
        </tr>
      </tbody>
    </table>

    <div class="cart-total">
      <p><strong>Total:</strong> $29</p>
    </div>

    <!-- Payment Options -->
    <div class="payment">
      <h3>Choose Payment Method</h3>
      <label><input type="radio" name="payment" checked> Cash</label>
      <label><input type="radio" name="payment"> Credit Card</label>
    </div>

    <div class="checkout">
      <a href="statement.html" class="btn">Proceed to Checkout</a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Addis-Bites. All rights reserved.</p>
  </footer>

</body>
</html>
